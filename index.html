<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luke / Float64 Home</title>
  <script src="vertex.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100..700;1,100..700&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #f5f7fa;
      --panel:   #ffffff;
      --border:  #e0e4ea;
      --acc:     #00bfff;
      --orange:  #ff8c00;
      --body:    #333333;
      --head:    #1a1a1a;
      --muted:   #777777;
      --font:    "Courier New", monospace;
    }

    html, body { height: 100%; background: var(--bg); color: var(--body); font-family: var(--font); }
    #root { min-height: 100vh; padding-bottom: 90px; }
    a { color: var(--acc); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Nav ── */
    .nav {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 10px 28px 10px 0;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      flex-wrap: nowrap;
    }

    /* ── Brand: site-header from index.html, preserved exactly ── */
    .brand {
      margin-right: auto;
      flex-shrink: 0;
      /* carries its own fonts/colours inline on child spans */
      font-family: "IBM Plex Sans", sans-serif;
      font-optical-sizing: auto;
      font-weight: 900;
      font-style: italic;
      font-variation-settings: "wdth" 100;
      font-size: 36px;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
    }
    @media (max-width: 480px) {
      .brand { font-size: 24px; }
    }
    .brand #float64 {
      font-weight: bold;
      color: white;
      background-color: #87CEEB;
      padding: 5px 10px;
      font-style: italic;
    }
    .brand #welcome {
      color: white;
      background-color: black;
      padding: 5px 10px;
      font-style: normal;
    }

    .nav a {
      color: #36545e;
      text-decoration: none;
      font-size: 1.3em;
      letter-spacing: .12em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav a:hover { text-decoration: underline; }

    /* ── Views ── */
    .view { padding: 40px 28px; }
    .view h1 { font-size: 1.5rem; font-weight: normal; color: var(--head); margin-bottom: 1rem; }
    .view p  { font-size: .9rem; line-height: 1.75; margin-bottom: 1.2rem; }

    /* ── Search bar ── */
    .search-bar {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 20px;
      padding: 10px 14px;
      font-family: var(--font);
      font-size: .9rem;
      color: var(--body);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .search-bar:focus {
      outline: none;
      border-color: var(--acc);
    }
    .search-bar::placeholder { color: var(--muted); }

    /* ── Post list (index.html style, driven from JSON) ── */
    .post-list {
      font-family: "Source Sans 3", sans-serif;
      font-optical-sizing: auto;
      font-weight: 400;
    }
    .post-link {
      display: block;
      margin-bottom: 30px;
      font-size: 20px;
      color: #222325;
    }
    .post-link:first-of-type { margin-top: 10px; }
    .post-link a {
      display: contents;
      color: #088af5;
      text-decoration: none;
      font-size: 1.1em;
    }
    .post-link a:hover { text-decoration: underline; }

    /* ── Player bar ── */
    .player-bar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 78px;
      background: var(--panel); border-top: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px; padding: 0 20px;
      box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
      z-index: 100;
    }

    /* Play/pause */
    .player-bar button.play-btn {
      background: none; border: 1px solid var(--border); color: var(--body);
      font-family: var(--font); font-size: 1.5rem; width: 52px; height: 52px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all .12s; border-radius: 50%;
      flex-shrink: 0;
    }
    .player-bar button.play-btn:hover,
    .player-bar button.play-btn.playing { border-color: var(--acc); color: var(--acc); }

    /* Center: track name + wide playhead */
    .player-bar .center {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .player-bar .track-name {
      font-size: .76rem; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .player-bar .track-name.loaded { color: var(--body); }
    .player-bar .center input[type=range] {
      width: 100%; accent-color: var(--acc); cursor: pointer; height: 5px;
    }

    /* Right: time + volume + hamburger */
    .player-bar .right {
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .player-bar .time {
      font-size: .72rem; color: var(--muted); white-space: nowrap;
    }
    @media (max-width: 480px) {
      .player-bar .time { display: none; }
    }

    /* Volume – vertical popup */
    .volume-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .volume-wrapper button.volume-icon {
      background: none; border: 1px solid var(--border); color: var(--body);
      font-size: 1.35rem; padding: 8px 10px; cursor: pointer;
      transition: border-color .12s, color .12s;
    }
    .volume-wrapper button.volume-icon:hover { border-color: var(--acc); color: var(--acc); }

    .volume-popup {
      position: absolute;
      right: -1px;
      bottom: 55px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 16px 12px 12px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      opacity: 0;
      visibility: hidden;
      transition: opacity .18s, visibility .18s;
      pointer-events: none;
      z-index: 110;
    }
    .player-bar:hover .volume-popup,
    .volume-wrapper:hover .volume-popup {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .volume-popup input[type=range] {
      -webkit-appearance: slider-vertical;
      writing-mode: bt-lr;
      width: 28px;
      height: 140px;
      accent-color: var(--acc);
      cursor: pointer;
      background: transparent;
    }

    /* ── Hamburger playlist ── */
    .hamburger-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .hamburger-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--body);
      font-size: 1.2rem;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color .12s, color .12s;
      flex-direction: column;
      gap: 5px;
      padding: 10px;
    }
    .hamburger-btn:hover,
    .hamburger-btn.open { border-color: var(--acc); color: var(--acc); }
    .hamburger-btn .bar {
      display: block;
      width: 18px;
      height: 2px;
      background: currentColor;
      border-radius: 1px;
      transition: background .12s;
    }

    .playlist-popup {
      position: absolute;
      right: 0;
      bottom: 55px;
      width: 320px;
      max-width: calc(100vw - 40px);
      max-height: 60vh;
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.16);
      z-index: 120;
      padding: 8px 0;
    }
    .playlist-popup .pl-header {
      font-size: .7rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 8px 16px 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }
    .pl-track {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      transition: background .1s;
      font-size: .82rem;
      font-family: var(--font);
      color: var(--body);
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }
    .pl-track:hover { background: var(--bg); }
    .pl-track .pl-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background .15s;
    }
    .pl-track.active {
      color: var(--orange);
    }
    .pl-track.active .pl-dot {
      background: var(--orange);
    }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 40px;
      padding: 20px 0;
      border-top: 1px solid var(--border);
    }
    .pagination button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--body);
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.12s;
      font-family: var(--font);
    }
    .pagination button:hover:not(:disabled) {
      border-color: var(--acc);
      color: var(--acc);
    }
    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .pagination .page-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="root">
    <nav class="nav">
      <div class="brand">
        <span id="float64">Float64</span><span id="welcome">Amplifier</span>
      </div>
      <a href="#home">Home</a>
      <a href="#about">About</a>
    </nav>
    <div id="view-mount"></div>
    <div id="player-mount" class="player-bar"></div>
  </div>

  <script>
    const { template: VTemplate, Router, $v: V$ } = Vertex;

    /* ── Data ── */

    const POSTS = [
     // { date: '9/6/2026', label: 'The Reactor And The Hand',   url: 'the-reactor-and-the-hand.html' },
      { date: '09/08/2026', label: 'The Body Electric — What Michael Levin\'s Lab Is Teaching Us About How Bodies Build Themselves',   url: 'the-body-electric.html' },
      { date: '29/7/2026', label: 'What a Quantum MPC Paper Teaches Us About Walking in a Spinning City',   url: 'float64-mpc-oneill-essay.html' },
      { date: '15/3/2026', label: 'Offline-Ready Survival Guide',   url: 'Survival%20Guide.html' },
      { date: '8/3/2026', label: 'Scroll – A minimal irssi-inspired IRC client',   url: 'https://github.com/float64co/Scroll' },
      { date: '7/3/2026', label: 'law.py — A Distributed Legislature (Updated)',   url: 'https://gist.githubusercontent.com/float64co/deb887691f13dee9ca160c809b93ff94/raw/c905fe424987e74791e82e78330b11a560dc67c6/law.py' },
      { date: '7/3/2026', label: 'Agents of Chaos: Ghost in the Shellcode',   url: 'float64_issue001_agents_of_chaos.html' },
      { date: '2/3/2026', label: 'How Bad Can The Iran War Get? (UPDATED - Day 3)',   url: 'iran-war-risk-day-3.html' },
      { date: '2/3/2026', label: 'Community-Based Agents',   url: 'community_based_agents.html' },
      { date: '1/3/2026', label: 'Vertex.js — A 1kloc SPA framework',   url: 'vertex-manual.html' },
      { date: '1/3/2026', label: 'law.py — A Distributed Legislature',   url: 'https://gist.githubusercontent.com/float64co/deb887691f13dee9ca160c809b93ff94/raw/0a92a208214e99d01f1812a9b0a91d5f77b9ee17/law.py' },
      { date: '28/2/2026', label: 'TOUR DE FORCE (preview)',               url: 'tour-de-force-chapter-one.html' },
      { date: '28/2/2026', label: 'How Bad Can The Iran War Get?',         url: 'iran-war-risk.html' },
      { date: '28/2/2026', label: 'UK Pathogen Sensor Deployment Report',  url: 'uk-pathogen-sensor-deployment-report.html' },
      { date: '27/2/2026', label: 'Engineering Retention Playbook',        url: 'engineering-retention-playbook.html' },
    ];

    const TRACKS = [
      { id: 1, label: 'Tunage - Found Sound',    url: 'Found%20Sound.mp3' },
      { id: 2, label: 'Tunage - Powa',           url: 'Powa.mp3' },
      { id: 3, label: 'Tunage - Basically', url: 'Basically.mp3' },
    ];

    const ITEMS_PER_PAGE = 10;

    /* ── View template (home / about / 404) ── */

    const VIEW_TEMPLATE =
      '{{#if isHome}}' +
        '<div class="view">' +
          '<h1>/ home</h1>' +
          '<input type="text" class="search-bar" data-bind="searchQuery" placeholder="Search posts…" autocomplete="off">' +
          '{{#if isSearching}}' +
            '<div class="post-list">' +
              '{{#each searchResults}}<span class="post-link">{{date}} <a href="{{url}}">{{label}}</a></span>{{/each}}' +
              '{{#if noResults}}<p>No posts match “{{searchQuery}}”.</p>{{/if}}' +
            '</div>' +
          '{{else}}' +
            '<div class="post-list">' +
              '{{#each posts}}<span class="post-link">{{date}} <a href="{{url}}">{{label}}</a></span>{{/each}}' +
            '</div>' +
            '<div class="pagination">' +
              '<button class="prev-btn"{{#if atFirstPage}} disabled{{/if}}>← Previous</button>' +
              '<div class="page-info">Page <strong>{{currentPage}}</strong> of <strong>{{totalPages}}</strong></div>' +
              '<button class="next-btn"{{#if atLastPage}} disabled{{/if}}>Next →</button>' +
            '</div>' +
          '{{/if}}' +
        '</div>' +
      '{{/if}}' +
      '{{#if isAbout}}' +
        '<div class="view">' +
          '<h1>/ about</h1>' +
          '<p>Luke\'s Float64 blog. Built with <a href="vertex-manual.html">Vertex.js</a>.</p>' +
        '</div>' +
      '{{/if}}' +
      '{{#if isNotFound}}' +
        '<div class="view">' +
          '<h1>404</h1>' +
          '<p>Route not found: #{{route}}</p>' +
        '</div>' +
      '{{/if}}';

    const viewTemplate = new VTemplate({
      el:       '#view-mount',
      template: VIEW_TEMPLATE,
      data: {
        isHome: true, isAbout: false, isNotFound: false, route: '',
        currentPage: 1,
        totalPages: Math.ceil(POSTS.length / ITEMS_PER_PAGE),
        searchQuery: ''
      },
      computed: {
        posts: function () {
          var start = (this._data.currentPage - 1) * ITEMS_PER_PAGE;
          return POSTS.slice(start, start + ITEMS_PER_PAGE);
        },
        atFirstPage: function () { return this._data.currentPage === 1; },
        atLastPage:  function () { return this._data.currentPage === this._data.totalPages; },
        isSearching: function () { return this._data.searchQuery.trim().length >= 3; },
        searchResults: function () {
          var q = this._data.searchQuery.trim().toLowerCase();
          return POSTS.filter(function (p) {
            return p.label.toLowerCase().indexOf(q) > -1 || p.date.indexOf(q) > -1;
          });
        },
        noResults: function () {
          return this._data.searchQuery.trim().length >= 3 && this._data.searchResults.length === 0;
        }
      }
    });

    V$('#view-mount').on('click', '.prev-btn', function () {
      viewTemplate.set('currentPage', Math.max(1, viewTemplate.get('currentPage') - 1));
    });
    V$('#view-mount').on('click', '.next-btn', function () {
      viewTemplate.set('currentPage', Math.min(viewTemplate.get('totalPages'), viewTemplate.get('currentPage') + 1));
    });

    function showHome()     { viewTemplate.update({ isHome: true,  isAbout: false, isNotFound: false }); }
    function showAbout()    { viewTemplate.update({ isHome: false, isAbout: true,  isNotFound: false }); }
    function showNotFound(route) {
      viewTemplate.update({ isHome: false, isAbout: false, isNotFound: true, route: route });
    }

    Router
      .add('',      showHome)
      .add('home',  showHome)
      .add('about', showAbout)
      .add('*route', function (params) { showNotFound(params.route); });

    /* ── Player bar ── */

    const PLAYER_TEMPLATE =
      '<button class="play-btn{{#if isPlaying}} playing{{/if}}" data-action="toggle-play">{{playIcon}}</button>' +
      '<div class="center">' +
        '<div class="track-name{{#if currentTrackLabel}} loaded{{/if}}">' +
          '{{#if currentTrackLabel}}{{currentTrackLabel}}{{else}}— no track loaded —{{/if}}' +
        '</div>' +
        '<input type="range" min="0" max="100" data-bind="progress">' +
      '</div>' +
      '<div class="right">' +
        '<span class="time">{{currentTimeStr}} / {{durationStr}}</span>' +
        '<div class="volume-wrapper">' +
          '<button class="volume-icon">🔊</button>' +
          '<div class="volume-popup">' +
            '<input type="range" min="0" max="1" step="0.01" value="{{volume}}" data-action="volume">' +
          '</div>' +
        '</div>' +
        '<div class="hamburger-wrapper">' +
          '<button class="hamburger-btn{{#if playlistOpen}} open{{/if}}" aria-label="Playlist" data-action="toggle-playlist">' +
            '<span class="bar"></span><span class="bar"></span><span class="bar"></span>' +
          '</button>' +
          '{{#if playlistOpen}}' +
          '<div class="playlist-popup">' +
            '<div class="pl-header">Playlist</div>' +
            '{{#each tracks}}' +
              '<button class="pl-track{{#if active}} active{{/if}}" data-action="play-track" data-url="{{url}}">' +
                '<span class="pl-dot"></span>{{label}}' +
              '</button>' +
            '{{/each}}' +
          '</div>' +
          '{{/if}}' +
        '</div>' +
      '</div>';

    function fmtTime(s) {
      if (!s || isNaN(s)) return '0:00';
      var m = Math.floor(s / 60);
      var sec = Math.floor(s % 60);
      return m + ':' + String(sec).padStart(2, '0');
    }

    const playerTemplate = new VTemplate({
      el:       '#player-mount',
      template: PLAYER_TEMPLATE,
      data: {
        isPlaying: false,
        currentTrackUrl: null,
        currentTrackLabel: null,
        progress: 0,
        currentTimeStr: fmtTime(0),
        durationStr: fmtTime(0),
        volume: 0.8,
        playlistOpen: false
      },
      computed: {
        playIcon: function () { return this._data.isPlaying ? '❚❚' : '▶'; },
        tracks: function () {
          var d = this._data;
          return TRACKS.map(function (t) {
            return { label: t.label, url: t.url, active: d.currentTrackUrl === t.url && d.isPlaying };
          });
        }
      }
    });

    /* Close playlist when clicking outside the player bar */
    document.addEventListener('click', function (e) {
      if (!playerTemplate.get('playlistOpen')) return;
      if (e.target.closest && e.target.closest('.hamburger-wrapper')) return;
      playerTemplate.set('playlistOpen', false);
    });

    /* The scrubber is data-bind="progress" — dragging it only commits (and
       fires this) on release, never mid-drag; see vertex.js for why. */
    playerTemplate.on('change', function (ev) {
      if (ev.keypath === 'progress') seek(parseFloat(ev.value));
    });

    var audio = new Audio();
    audio.preload = 'auto';
    audio.volume = 0.8;
    var currentIdx = -1;
    var progressTimer = null;

    function play(url, idx) {
      var resolvedIdx = (idx !== undefined) ? idx : TRACKS.findIndex(function (t) { return t.url === url; });
      if (url && audio.src.indexOf(url) === -1) {
        audio.src = url;
      }
      audio.play().then(function () {
        currentIdx = (resolvedIdx !== -1) ? resolvedIdx : currentIdx;
        var trackObj = TRACKS.find(function (t) { return t.url === audio.src || audio.src.indexOf(t.url) > -1; });
        playerTemplate.update({
          isPlaying: true,
          currentTrackUrl: trackObj ? trackObj.url : (url || audio.src),
          currentTrackLabel: trackObj ? trackObj.label : null
        });
        startProgressTimer();
      }).catch(console.error);
    }

    function pause() {
      audio.pause();
      playerTemplate.set('isPlaying', false);
      stopProgressTimer();
    }

    function seek(percent) {
      if (audio.duration) audio.currentTime = (percent / 100) * audio.duration;
    }

    function setVolume(vol) {
      var v = Math.max(0, Math.min(1, parseFloat(vol)));
      audio.volume = v;
      playerTemplate.set('volume', v);
    }

    function startProgressTimer() {
      stopProgressTimer();
      progressTimer = setInterval(function () {
        playerTemplate.update({
          progress: audio.duration ? (audio.currentTime / audio.duration) * 100 : 0,
          currentTimeStr: fmtTime(audio.currentTime),
          durationStr: fmtTime(audio.duration)
        });
      }, 250);
    }

    function stopProgressTimer() {
      if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
    }

    audio.addEventListener('ended', function () {
      var nextIdx = (currentIdx + 1) % TRACKS.length;
      play(TRACKS[nextIdx].url, nextIdx);
    });

    V$('#player-mount').on('click', '[data-action="toggle-play"]', function () {
      if (playerTemplate.get('isPlaying')) {
        pause();
      } else {
        play(playerTemplate.get('currentTrackUrl') || TRACKS[0].url, currentIdx !== -1 ? currentIdx : 0);
      }
    });

    V$('#player-mount').on('input', '[data-action="volume"]', function () {
      setVolume(this.value);
    });

    V$('#player-mount').on('click', '[data-action="toggle-playlist"]', function (e) {
      e.stopPropagation();
      playerTemplate.set('playlistOpen', !playerTemplate.get('playlistOpen'));
    });

    V$('#player-mount').on('click', '[data-action="play-track"]', function () {
      play(this.getAttribute('data-url'));
    });

    Router.start();
  </script>
</body>
</html>
