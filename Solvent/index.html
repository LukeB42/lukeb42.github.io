class Mech:
    _uid = 0

    def __init__(self, name, chassis, weapons, is_player=True):
        Mech._uid += 1
        self.uid = Mech._uid
        self.name = name
        self.chassis = chassis
        self.weapons = list(weapons)
        self.max_hp = CHASSIS[chassis]["hp"]
        self.hp = self.max_hp
        self.is_player = is_player
        self.braced = False
        self.heal_used = {}   # weapon name -> uses this battle
        self.enemy_bonus = dict(acc=0, armor=0, speed=0, dmg=0.0)  # tier scaling

    # -- stat accessors (player mechs read the shared tech state) -------------
    def armor(self, state):
        a = CHASSIS[self.chassis]["armor"]
        if self.is_player:
            if "alloys1" in state.techs: a += 2
            if "alloys2" in state.techs: a += 2
        else:
            a += self.enemy_bonus["armor"]
        if self.braced:
            a += 3
        return a

    def speed(self, state):
        s = CHASSIS[self.chassis]["speed"]
        if self.is_player:
            if "reactors" in state.techs: s += 2
        else:
            s += self.enemy_bonus["speed"]
        return s

    def accuracy(self, state, weapon):
        acc = WEAPONS[weapon]["acc"]
        if self.is_player:
            if "targeting1" in state.techs: acc += 5
            if "targeting2" in state.techs: acc += 5
        else:
            acc += self.enemy_bonus["acc"]
        return min(acc, 99)

    def roll_damage(self, state, weapon, rng=random):
        lo, hi = WEAPONS[weapon]["dmg"]
        dmg = rng.randint(lo, hi)
        if self.is_player and "myomer" in state.techs:
            dmg = int(round(dmg * 1.2))
        elif not self.is_player:
            dmg = int(round(dmg * (1.0 + self.enemy_bonus["dmg"])))
        return dmg

    def heal_remaining(self, weapon):
        cap = WEAPONS[weapon].get("charges", 0) * self.weapons.count(weapon)
        return cap - self.heal_used.get(weapon, 0)

    @property
    def alive(self):
        return self.hp > 0

    def repair_cost(self):
        missing = self.max_hp - self.hp
        return int(missing * 6)

    def value(self):
        return CHASSIS[self.chassis]["cost"] + sum(WEAPONS[w]["cost"] for w in self.weapons)

    def to_dict(self):
        return dict(name=self.name, chassis=self.chassis, weapons=self.weapons,
                    hp=self.hp)

    @classmethod
    def from_dict(cls, d):
        m = cls(d["name"], d["chassis"], d["weapons"], is_player=True)
        m.hp = d["hp"]
        return m


class GameState:
    def __init__(self):
        self.credits = 2400
        self.salvage = 0
        self.techs = set()
        self.roster = []
        self.beaten = set()          # outfit names defeated
        self.won = False
        self.act = 1
        self.act2 = None
        self.turn_log = []

    def unlocked_chassis(self):
        return [c for c, d in CHASSIS.items() if d["tech"] is None or d["tech"] in self.techs]

    def unlocked_weapons(self):
        return [w for w, d in WEAPONS.items() if d["tech"] is None or d["tech"] in self.techs]

    def available_techs(self):
        out = []
        for key, t in TECHS.items():
            if key in self.techs:
                continue
            if t["prereq"] and t["prereq"] not in self.techs:
                continue
            out.append(key)
        return out

    def next_contract_index(self):
        for i, o in enumerate(OUTFITS):
            if o["name"] not in self.beaten:
                return i
        return None

    def to_dict(self):
        return dict(version=2, credits=self.credits, salvage=self.salvage,
                    techs=sorted(self.techs), beaten=sorted(self.beaten),
                    roster=[m.to_dict() for m in self.roster], won=self.won,
                    act=self.act, act2=self.act2)

    @classmethod
    def from_dict(cls, d):
        s = cls()
        s.credits = d["credits"]
        s.salvage = d["salvage"]
        s.techs = set(d["techs"])
        s.beaten = set(d["beaten"])
        s.roster = [Mech.from_dict(m) for m in d["roster"]]
        s.won = d.get("won", False)
        if d.get("version", 1) >= 2:
            s.act = d.get("act", 1)
            s.act2 = d.get("act2")
        elif s.won:   # v1 save that beat Force Majeure: promote to Act II

def build_enemy_squad(outfit):
    """Generate an enemy squad scaled to the outfit's tier."""
    tier = outfit["tier"]
    templates = {
        1: [("Jackal", ["SMG Pod"]), ("Jackal", ["SMG Pod"])],
        2: [("Jackal", ["Autocannon"]), ("Brute", ["Autocannon", "SMG Pod"])],
        3: [("Brute", ["Autocannon", "Missile Rack"]), ("Brute", ["Autocannon", "SMG Pod"]),
            ("Wisp", ["SMG Pod"]), ("Jackal", ["Missile Rack"])],
        4: [("Warden", ["Missile Rack", "Autocannon"]), ("Brute", ["Laser Lance", "SMG Pod"]),
            ("Brute", ["Autocannon", "Missile Rack"])],
        5: [("Warden", ["Laser Lance", "Missile Rack"]), ("Warden", ["Autocannon", "Autocannon"]),
            ("Brute", ["Laser Lance", "Missile Rack"]), ("Kestrel", ["Missile Rack"])],
        6: [("Colossus", ["Railgun", "Laser Lance", "Missile Rack"]),
            ("Warden", ["Laser Lance", "Missile Rack"]),
            ("Warden", ["Railgun"]),
            ("Ferrum", ["Missile Rack", "Autocannon"]),
            ("Wisp", ["SMG Pod"])],
    }
    squad = []
    names = random.sample(ENEMY_NAMES, len(templates[tier]))
    for (chassis, weps), nm in zip(templates[tier], names):
        m = Mech(f"{nm}", chassis, weps, is_player=False)
        # tier scaling so replays of early contracts stay easy, later ones bite
        m.enemy_bonus = dict(acc=tier, armor=tier // 2, speed=tier // 3,
                             dmg=0.03 * tier)
        squad.append(m)
    return squad


def resolve_attack(state, attacker, weapon, defender, rng=random):
    """Returns a log string; mutates defender HP."""
    acc = attacker.accuracy(state, weapon)
    acc -= CHASSIS[defender.chassis].get("evade", 0)
    if defender.braced:
        acc -= 10
    roll = rng.randint(1, 100)
    if roll > acc:
        return f"{attacker.name}'s {weapon} misses {defender.name}."
    dmg = attacker.roll_damage(state, weapon, rng=rng)
    armor = defender.armor(state)
    pierce = WEAPONS[weapon]["pierce"]
    effective_armor = int(round(armor * (1.0 - pierce)))
    dealt = max(1, dmg - effective_armor)
    defender.hp = max(0, defender.hp - dealt)
    tag = " DESTROYED." if defender.hp == 0 else ""
    return f"{attacker.name}'s {weapon} hits {defender.name} for {dealt}.{tag}"


def resolve_heal(state, healer, weapon, target, rng=random):
    """Repair a friendly frame; revives it if downed. Returns a log string."""
    lo, hi = WEAPONS[weapon]["dmg"]
    healer.heal_used[weapon] = healer.heal_used.get(weapon, 0) + 1
    amount = rng.randint(lo, hi)
    was_down = target.hp == 0
    target.hp = min(target.max_hp, target.hp + amount)
    if was_down:
        return (f"{healer.name}'s {weapon} reboots {target.name} "
                f"at {target.hp} HP.")
    return f"{healer.name}'s {weapon} repairs {target.name} for {amount}."


def initiative_order(state, units, rng=random):
    scored = [(u.speed(state) + rng.randint(1, 6), rng.random(), u) for u in units if u.alive]
    scored.sort(key=lambda t: (-t[0], t[1]))
    return [u for _, _, u in scored]


def enemy_choose_action(state, enemy, player_squad, rng=random):
    """Greedy AI: best expected-damage weapon against the weakest live target."""
    targets = [m for m in player_squad if m.alive]
    if not targets:
        return None, None
    target = min(targets, key=lambda m: m.hp)
    def expected(w):
        if WEAPONS[w]["heal"]:
            return -1
        lo, hi = WEAPONS[w]["dmg"]
        return (lo + hi) / 2 * enemy.accuracy(state, w) / 100.0
    guns = [w for w in enemy.weapons if not WEAPONS[w]["heal"]]
    if not guns:
        return None, None
    weapon = max(guns, key=expected)
    return weapon, target


def contract_rewards(state, outfit, first_time):
    credits = outfit["credits"]
    salvage = outfit["salvage"]
    if not first_time:
        credits = int(credits * 0.4)
        salvage = int(salvage * 0.4)
    if "salvage_rigs" in state.techs:
        salvage = int(round(salvage * 1.4))
    return credits, salvage

A2_BASE_INCOME = 800
A2_UPKEEP_RATE = 0.02
A2_START_CAP = 3000
A2_EXPAND_COST = 2500
A2_EXPAND_GAIN = 1000
A2_EXPAND_MAX = 3
A2_DOCTRINES = ["BALANCED", "FOCUS ARMOR", "SWEEP SWARMS", "SCREEN", "ENGINEERS"]


def a2_init(state):
    """Convert the Act I outfit into a production-war force."""
    force = {}
    for m in state.roster:
        force[m.chassis] = force.get(m.chassis, 0) + 1
    force["Haund"] = force.get("Haund", 0) + 6
    state.roster = []
    state.act = 2
    state.credits += 4000
    state.act2 = dict(force=force, held=[], turn=1,
                      cap=A2_START_CAP, cap_used=0, expands=0,
                      interlude_seen=False, ledger=["The factories are yours now."])


def a2_available_units(state):
    out = []
    for name, u in A2_UNITS.items():
        gate = CHASSIS.get(name, {}).get("tech")
        if name == "Nanoswarm Column":
            gate = "nanoswarm"
        if gate is None or gate in state.techs:
            out.append(name)
    return out


def a2_force_value(force):
    return sum(A2_UNITS[c]["cost"] * n for c, n in force.items())


def a2_build(state, unit, count):
    a2 = state.act2
    u = A2_UNITS[unit]
    cost = u["cost"] * count
    if unit not in a2_available_units(state):
        return "Not in the production catalogue yet."
    if cost > state.credits:
        return "Insufficient credits."
    if cost > a2["cap"] - a2["cap_used"]:
        return "Factory capacity exhausted this turn."
    state.credits -= cost
    a2["cap_used"] += cost
    a2["force"][unit] = a2["force"].get(unit, 0) + count
    return None


def a2_expand(state):
    a2 = state.act2
    if a2["expands"] >= A2_EXPAND_MAX:
        return "The industrial base is maxed out."
    if state.credits < A2_EXPAND_COST:
        return "Insufficient credits."
    state.credits -= A2_EXPAND_COST
    a2["expands"] += 1
    a2["cap"] += A2_EXPAND_GAIN
    return None


def a2_end_turn(state):
    """Income, upkeep, desertion, capacity reset. Returns ledger lines."""
    a2 = state.act2
    lines = []
    income = A2_BASE_INCOME + sum(A2_THEATERS[i]["revenue"] for i in a2["held"])
    state.credits += income
    lines.append(f"Turn {a2['turn']}: revenue {income:,}cr "
                 f"({len(a2['held'])} theaters held).")
    upkeep = int(a2_force_value(a2["force"]) * A2_UPKEEP_RATE)
    if upkeep:
        if state.credits >= upkeep:
            state.credits -= upkeep
            lines.append(f"Fleet upkeep: -{upkeep:,}cr.")
        else:
            lines.append("Upkeep unpayable — units desert.")
            order = sorted(a2["force"], key=lambda c: A2_UNITS[c]["cost"])
            while a2["force"] and int(a2_force_value(a2["force"]) * A2_UPKEEP_RATE) > state.credits:
                c = order[0] if a2["force"].get(order[0]) else                     min(a2["force"], key=lambda x: A2_UNITS[x]["cost"])
                a2["force"][c] -= 1
                if a2["force"][c] <= 0:
                    del a2["force"][c]
                lines.append(f"A {c} crew walks off the job.")
                if len(lines) > 12:
                    break
            upk = int(a2_force_value(a2["force"]) * A2_UPKEEP_RATE)
            state.credits = max(0, state.credits - upk)
    a2["turn"] += 1
    a2["cap_used"] = 0
    a2["ledger"] = lines
    return lines


def a2_start_battle(state, theater_idx, commit):
    """commit: {unit: count} subset of the force. Returns battle dict or error str."""
    a2 = state.act2
    th = A2_THEATERS[theater_idx]
    for c, n in commit.items():
        if n < 0 or n > a2["force"].get(c, 0):
            return "Commit exceeds available units."
    if not any(n > 0 and A2_UNITS[c]["role"] != "support" for c, n in commit.items()):
        return "Commit at least one combat formation."
    commit = {c: n for c, n in commit.items() if n > 0}
    for c, n in commit.items():
        a2["force"][c] -= n
        if a2["force"][c] <= 0:
            del a2["force"][c]
    mk = lambda comp: {c: dict(count=n, pool=float(n * A2_UNITS[c]["ehp"]))
                       for c, n in comp.items()}
    return dict(theater=theater_idx, round=0,
                p=mk(commit), e=mk(dict(th["defenders"])),
                eng=2 * commit.get("Nanoswarm Column", 0),
                e_eng=2 * th["defenders"].get("Nanoswarm Column", 0),
                log=[f"Offensive launched: {th['name']}.", th["blurb"]])


def _a2_alive(side):
    return {c: s for c, s in side.items() if s["count"] > 0}


def _a2_combat_count(side):
    return sum(s["count"] for c, s in side.items()
               if A2_UNITS[c]["role"] != "support" and s["count"] > 0)


def _a2_share(side, role):
    tot = sum(s["count"] * A2_UNITS[c]["cost"] for c, s in _a2_alive(side).items())
    part = sum(s["count"] * A2_UNITS[c]["cost"] for c, s in _a2_alive(side).items()
               if A2_UNITS[c]["role"] == role)
    return part / tot if tot else 0.0


def a2_enemy_doctrine(b, rng=random):
    pool = sum(s["pool"] for s in b["e"].values())
    cap = sum(s["count"] * A2_UNITS[c]["ehp"] for c, s in b["e"].items()) or 1
    if b.get("e_eng", 0) > 0 and pool / cap < 0.6:
        return "ENGINEERS"
    if _a2_share(b["p"], "armor") > 0.35:
        return "FOCUS ARMOR"
    if _a2_share(b["p"], "swarm") > 0.5:
        return "SWEEP SWARMS"
    return "BALANCED"


def _a2_deal(attacker, defender, doctrine, rng, log, tag, phase):
    """Compute one side's damage onto the other. Returns {stack: dmg}."""
    weights = {}
    for dc, ds in _a2_alive(defender).items():
        w = ds["pool"]
        role = A2_UNITS[dc]["role"]
        if doctrine == "FOCUS ARMOR" and role == "armor":
            w *= 2
        if doctrine == "SWEEP SWARMS" and role == "swarm":
            w *= 2
        weights[dc] = w
    tot_w = sum(weights.values()) or 1.0
    out_mult = 1.0
    if doctrine in ("SCREEN", "ENGINEERS"):
        out_mult = 0.85
    dmg = {}
    for ac, asx in _a2_alive(attacker).items():
        au = A2_UNITS[ac]
        if au["role"] == "support":
            continue
        if phase == "orbital" and au["role"] != "orbital":
            continue
        if phase == "main" and au["role"] == "orbital":
            continue
        power = asx["count"] * au["ap"] * out_mult * rng.uniform(0.9, 1.1)
        for dc, w in weights.items():
            share = power * (w / tot_w)
            mult = A2_ROLE_MULT[au["role"]][A2_UNITS[dc]["role"]]
            dmg[dc] = dmg.get(dc, 0.0) + share * mult
    return dmg


def _a2_apply(side, dmg, self_doctrine, log, side_name):
    # SCREEN: swarm stacks absorb 50% of damage aimed at non-swarm
    if self_doctrine == "SCREEN":
        swarms = [c for c in _a2_alive(side) if A2_UNITS[c]["role"] == "swarm"]
        if swarms:
            moved = 0.0
            for c in list(dmg):
                if A2_UNITS[c]["role"] != "swarm":
                    take = dmg[c] * 0.5
                    dmg[c] -= take
                    moved += take
            per = moved / len(swarms)
            for c in swarms:
                dmg[c] = dmg.get(c, 0.0) + per
    for c, d in dmg.items():
        if c not in side or side[c]["count"] <= 0:
            continue
        side[c]["pool"] = max(0.0, side[c]["pool"] - d)
        ehp = A2_UNITS[c]["ehp"]
        new_count = min(side[c]["count"], int((side[c]["pool"] + ehp - 1) // ehp))
        losses = side[c]["count"] - new_count
        side[c]["count"] = new_count
        if losses:
            log.append(f"{side_name} {c} formation loses {losses} "
                       f"unit{'s' if losses != 1 else ''}.")


def a2_round(state, b, doctrine, rng=random):
    """Resolve one round. Returns 'ongoing' | 'won' | 'lost'."""
    b["round"] += 1
    e_doc = a2_enemy_doctrine(b, rng)
    b["log"].append(f"— Round {b['round']}: doctrine {doctrine}, "
                    f"hostile doctrine {e_doc} —")
    def run_engineers(side, charges_key, who):
        if b.get(charges_key, 0) <= 0:
            b["log"].append(f"{who}: no engineering charges left.")
            return
        b[charges_key] -= 1
        cols = side.get("Nanoswarm Column", {"count": 0})["count"]
        heal = 45.0 * max(1, cols)
        hurt = sorted(((c, s) for c, s in _a2_alive(side).items()
                       if s["pool"] < s["count"] * A2_UNITS[c]["ehp"]),
                      key=lambda t: t[1]["pool"])
        if hurt:
            c, s = hurt[0]
            cap = s["count"] * A2_UNITS[c]["ehp"]
            s["pool"] = min(cap, s["pool"] + heal)
            b["log"].append(f"{who} nanoswarm columns restore the {c} formation.")
    if doctrine == "ENGINEERS":
        run_engineers(b["p"], "eng", "Dog")
    if e_doc == "ENGINEERS":
        run_engineers(b["e"], "e_eng", "Hostile")
    # orbital first strike, then main exchange (simultaneous within phase)
    for phase in ("orbital", "main"):
        pd = _a2_deal(b["p"], b["e"], doctrine, rng, b["log"], "player", phase)
        ed = _a2_deal(b["e"], b["p"], e_doc, rng, b["log"], "enemy", phase)
        _a2_apply(b["e"], pd, e_doc, b["log"], "Hostile")
        _a2_apply(b["p"], ed, doctrine, b["log"], "Dog")
    if _a2_combat_count(b["e"]) == 0:
        return "won"
    if _a2_combat_count(b["p"]) == 0:
        return "lost"
    if b["round"] >= 40:
        return "lost"
    return "ongoing"


def a2_breakoff(b):
    for c, s in b["p"].items():
        s["pool"] *= 0.9
        ehp = A2_UNITS[c]["ehp"]
        s["count"] = min(s["count"], int((s["pool"] + ehp - 1) // ehp))
    b["log"].append("Formations break off. The rearguard pays the toll.")


def a2_finish(state, b, outcome):
    """Fold survivors back into the force; apply theater rewards. Returns lines."""
    a2 = state.act2
    th = A2_THEATERS[b["theater"]]
    for c, s in b["p"].items():
        if s["count"] > 0:
            a2["force"][c] = a2["force"].get(c, 0) + s["count"]
    lines = []
    if outcome == "won":
        if b["theater"] not in a2["held"]:
            a2["held"].append(b["theater"])
        state.salvage += th["salvage"]
        lines.append(f"{th['name']} taken. +{th['salvage']} salvage; "
                     f"+{th['revenue']:,}cr/turn.")
        if th.get("cap_bonus"):
            a2["cap"] += th["cap_bonus"]
            lines.append(f"Captured production lines: +{th['cap_bonus']:,} capacity.")
        gt = th.get("grants_tech")
        if gt and gt not in state.techs:
            state.techs.add(gt)
            lines.append(f"Downlink schematics decrypted: {TECHS[gt]['name']} acquired.")
        if b["theater"] == len(A2_THEATERS) - 1:
            state.won = True
            lines.append("Counterparty liquidated. The market has one name on it.")
    elif outcome == "lost":
        lines.append(f"The offensive on {th['name']} is annihilated. "
                     "Committed formations are written off.")
    else:
        lines.append("Survivors return to the production pool.")
    return lines

def selftest():
    """Deterministic checks: mechanics, balance bands, economy progression."""
    print("SOLVENT self-test")
    rng = random.Random(1337)

    # --- mechanics: hit, miss, armor, pierce, brace -------------------------
    state = GameState()
    a = Mech("A", "Brute", ["Autocannon"], True)
    d = Mech("D", "Brute", ["SMG Pod"], False)

    class FixedRng:
        def __init__(self, rolls): self.rolls = list(rolls)
        def randint(self, lo, hi): return self.rolls.pop(0)

    d.hp = 100
    resolve_attack(state, a, "Autocannon", d, rng=FixedRng([1, 12]))   # sure hit, 12 dmg
    assert d.hp == 100 - max(1, 12 - d.armor(state)), "armor math"
    hp_before = d.hp
    resolve_attack(state, a, "Autocannon", d, rng=FixedRng([100]))     # sure miss
    assert d.hp == hp_before, "miss should not damage"
    d.braced = True
    assert d.armor(state) == CHASSIS["Brute"]["armor"] + 3, "brace armor"
    d.braced = False

    # heal and revive
    ally = Mech("H", "Haund", ["Repair Rig"], True)
    hurt = Mech("W", "Brute", ["Autocannon"], True)
    hurt.hp = 50
    resolve_heal(state, ally, "Repair Rig", hurt, rng=FixedRng([12]))
    assert hurt.hp == 62, "heal math"
    hurt.hp = 0
    assert not hurt.alive
    msg = resolve_heal(state, ally, "Repair Rig", hurt, rng=FixedRng([10]))
    assert hurt.alive and hurt.hp == 10 and "reboots" in msg, "revive"
    hurt.hp = hurt.max_hp - 3
    resolve_heal(state, ally, "Repair Rig", hurt, rng=FixedRng([16]))
    assert hurt.hp == hurt.max_hp, "heal caps at max HP"
    assert ally.heal_remaining("Repair Rig") == WEAPONS["Repair Rig"]["charges"] - 3, \
        "three uses consumed three charges"

    # evade: a sure hit against armor-0 Wisp misses through evade
    wisp = Mech("V", "Wisp", ["SMG Pod"], False)
    shooter = Mech("S", "Brute", ["Autocannon"], True)   # 80 acc, wisp evade 15
    hp0 = wisp.hp
    resolve_attack(state, shooter, "Autocannon", wisp, rng=FixedRng([70, 12]))
    assert wisp.hp == hp0, "evade should turn 70-roll into a miss (65 effective acc)"
    resolve_attack(state, shooter, "Autocannon", wisp, rng=FixedRng([60, 12]))
    assert wisp.hp < hp0, "60-roll still hits through evade"
    print("  mechanics OK (incl. heal, revive, evade)")

    # --- tech effects -------------------------------------------------------
    state.techs = {"targeting1", "targeting2", "alloys1", "myomer"}
    p = Mech("P", "Jackal", ["Autocannon"], True)
    assert p.accuracy(state, "Autocannon") == WEAPONS["Autocannon"]["acc"] + 10
    assert p.armor(state) == CHASSIS["Jackal"]["armor"] + 2
    lo, hi = WEAPONS["Autocannon"]["dmg"]
    dmgs = {p.roll_damage(state, "Autocannon") for _ in range(200)}
    assert max(dmgs) == int(round(hi * 1.2)), "myomer damage"
    print("  tech effects OK")

    # --- rewards & insurance ------------------------------------------------
    state = GameState()
    c0, s0 = contract_rewards(state, OUTFITS[0], True)
    c1, s1 = contract_rewards(state, OUTFITS[0], False)
    assert c1 < c0 and s1 <= s0, "replay pays less"
    state.techs.add("salvage_rigs")
    _, s2 = contract_rewards(state, OUTFITS[0], True)
    assert s2 > s0, "salvage rigs increase salvage"
    print("  rewards OK")

    # --- balance bands: prescribed squads per tier --------------------------
    LOADOUTS = {
        1: (set(), [("Jackal", ["Autocannon"]), ("Brute", ["Autocannon"])]),
        2: (set(), [("Brute", ["Autocannon", "Missile Rack"]),
                    ("Brute", ["Autocannon", "SMG Pod"]), ("Jackal", ["Autocannon"])]),
        3: ({"targeting1", "alloys1"},
            [("Brute", ["Autocannon", "Missile Rack"])] * 2 +
            [("Brute", ["Autocannon", "SMG Pod"]), ("Jackal", ["Missile Rack"])]),
        4: ({"targeting1", "alloys1", "heavy_frames", "reactors"},
            [("Warden", ["Missile Rack", "Autocannon"]),
             ("Brute", ["Autocannon", "Missile Rack"])] * 2),
        5: ({"targeting1", "targeting2", "alloys1", "alloys2", "heavy_frames",
             "reactors", "focused_optics"},
            [("Warden", ["Laser Lance", "Missile Rack"])] * 2 +
            [("Brute", ["Laser Lance", "Missile Rack"])] * 2),
        6: ({"targeting1", "targeting2", "alloys1", "alloys2", "reactors",
             "myomer", "focused_optics", "railgun_proto", "heavy_frames",
             "colossus_frames", "nanoswarm"},
            [("Colossus", ["Railgun", "Laser Lance", "Missile Rack"]),
             ("Warden", ["Railgun", "Laser Lance"]),
             ("Warden", ["Laser Lance", "Missile Rack"]),
             ("Warden", ["Laser Lance", "Nanoswarm Halo"])]),
    }

    def sim_battle(tier, seed):
        r = random.Random(seed * 7919 + tier)
        st = GameState()
        st.techs = set(LOADOUTS[tier][0])
        players = [Mech(f"P{i}", c, w, True)
                   for i, (c, w) in enumerate(LOADOUTS[tier][1])]
        enemies = build_enemy_squad(OUTFITS[tier - 1])
        rounds = 0
        while (any(m.alive for m in players) and any(e.alive for e in enemies)
               and rounds < 60):
            rounds += 1
            for u in initiative_order(st, players + enemies, rng=r):
                if not u.alive:
                    continue
                u.braced = False
                if u.is_player:
                    heals = [w for w in u.weapons
                             if WEAPONS[w]["heal"] and u.heal_remaining(w) > 0]
                    guns = [w for w in u.weapons if not WEAPONS[w]["heal"]]
                    downed = [m for m in players if not m.alive]
                    hurt = sorted((m for m in players if m.alive and m.hp < m.max_hp),
                                  key=lambda m: m.hp / m.max_hp)
                    if heals and downed:
                        resolve_heal(st, u, heals[0], downed[0], rng=r)
                    elif heals and hurt and hurt[0].hp / hurt[0].max_hp < 0.7:
                        resolve_heal(st, u, heals[0], hurt[0], rng=r)
                    elif guns:
                        tg = [e for e in enemies if e.alive]
                        if not tg:
                            break
                        t = min(tg, key=lambda e: e.hp)
                        w = max(guns, key=lambda w: sum(WEAPONS[w]["dmg"]))
                        resolve_attack(st, u, w, t, rng=r)
                    else:
                        u.braced = True
                else:
                    w, t = enemy_choose_action(st, u, players)
                    if w:
                        resolve_attack(st, u, w, t, rng=r)
        return not any(e.alive for e in enemies)

    N = 150
    floors = {1: 85, 2: 85, 3: 85, 4: 85, 5: 80, 6: 40}
    for tier in range(1, 7):
        wr = 100 * sum(sim_battle(tier, s) for s in range(N)) // N
        band = "boss" if tier == 6 else "std"
        assert wr >= floors[tier], f"tier {tier} win rate {wr}% below floor"
        assert wr <= 99 or tier <= 4, f"tier {tier} trivial at {wr}%"
        print(f"  tier {tier} balance OK ({wr}% with prescribed squad, {band})")

    # --- economy: each tier's loadout is affordable from prior earnings -----
    def loadout_cost(tier):
        techs, squad = LOADOUTS[tier]
        cost = sum(TECHS[t]["credits"] for t in techs)
        cost += sum(CHASSIS[c]["cost"] + sum(WEAPONS[w]["cost"] for w in ws)
                    for c, ws in squad)
        return cost

    def salvage_needed(tier):
        return sum(TECHS[t]["salvage"] for t in LOADOUTS[tier][0])

    MAX_GRINDS_PER_TIER = 8
    for tier in range(2, 7):
        st = GameState()
        income = 3000  # starting treasury
        salvage = 0
        for k in range(1, tier):
            c, s = contract_rewards(st, OUTFITS[k - 1], True)
            income += c
            salvage += s
            cg, sg = contract_rewards(st, OUTFITS[k - 1], False)
            income += cg * MAX_GRINDS_PER_TIER
            salvage += sg * MAX_GRINDS_PER_TIER
        assert income >= loadout_cost(tier), \
            f"tier {tier} loadout unaffordable: need {loadout_cost(tier)}, have {income}"
        assert salvage >= salvage_needed(tier), \
            f"tier {tier} salvage short: need {salvage_needed(tier)}, have {salvage}"
    print(f"  economy OK (every tier fundable with <= {MAX_GRINDS_PER_TIER} grinds/tier)")

    # --- insurance ----------------------------------------------------------
    m = Mech("X", "Brute", ["Autocannon"], True)
    assert m.value() // 3 > 0, "insurance payout positive"
    print("  insurance OK")

    # --- save/load round-trip ----------------------------------------------
    st = new_game()
    st.techs = {"targeting1"}
    st.beaten = {"Rustwater Irregulars"}
    st.credits = 3141
    st.salvage = 27
    d = st.to_dict()
    s2 = GameState.from_dict(json.loads(json.dumps(d)))
    assert (s2.credits, s2.salvage, s2.techs, s2.beaten) == \
           (st.credits, st.salvage, st.techs, st.beaten)
    assert len(s2.roster) == len(st.roster)
    assert s2.roster[0].hp == st.roster[0].hp
    print("  save/load round-trip OK")


    # ============================ ACT II ====================================
    # mechanics
    st = GameState(); st.act = 2
    st.act2 = dict(force={"Warden": 2, "Haund": 4, "Nanoswarm Column": 1},
                   held=[], turn=1, cap=99999, cap_used=0, expands=0,
                   interlude_seen=True, ledger=[])
    err = a2_build(st, "Colossus", 1)
    assert err, "colossus should be tech-gated in production"
    st.credits = 100
    assert a2_build(st, "Haund", 1), "should fail on credits"
    st.credits = 10000
    st.act2["cap_used"] = st.act2["cap"] = 100
    assert a2_build(st, "Haund", 1), "should fail on capacity"
    st.act2["cap"] = 99999; st.act2["cap_used"] = 0
    assert a2_build(st, "Haund", 2) is None and st.act2["force"]["Haund"] == 6
    print("  act2 production gates OK")

    # role counter: line formation beats equal-cost swarm decisively
    r = random.Random(7)
    def duel(pcomp, ecomp, seed):
        s2 = GameState(); s2.act = 2
        s2.act2 = dict(force=dict(pcomp), held=[], turn=1, cap=99999, cap_used=0,
                       expands=0, interlude_seen=True, ledger=[])
        A2_THEATERS.append(dict(name="_t", revenue=0, salvage=0,
                                defenders=dict(ecomp), blurb=""))
        b = a2_start_battle(s2, len(A2_THEATERS) - 1, dict(pcomp))
        rr = "ongoing"
        rngd = random.Random(seed)
        while rr == "ongoing":
            rr = a2_round(s2, b, "BALANCED", rng=rngd)
        A2_THEATERS.pop()
        return rr
    wins = sum(duel({"Warden": 4}, {"Haund": 16}, s) == "won" for s in range(60))
    assert wins >= 50, f"line should crush equal-cost swarm ({wins}/60)"
    print("  act2 role counters OK")

    # orbital first strike: a Halo can kill a Wisp stack before it replies
    s2 = GameState(); s2.act = 2
    s2.act2 = dict(force={"Halo Array": 3}, held=[], turn=1, cap=99999,
                   cap_used=0, expands=0, interlude_seen=True, ledger=[])
    A2_THEATERS.append(dict(name="_t", revenue=0, salvage=0,
                            defenders={"Wisp": 1}, blurb=""))
    b = a2_start_battle(s2, len(A2_THEATERS) - 1, {"Halo Array": 3})

    cost3 = a2_force_value(A2_TEST_FORCES[2])

    s3 = GameState.from_dict(json.loads(json.dumps(d2)))
    assert s3.act == 2 and s3.act2["held"] == [0, 1] and s3.act2["force"] == s2.act2["force"]
    v1_win = dict(credits=9000, salvage=12, techs=["nanoswarm"], beaten=sorted(
        o["name"] for o in OUTFITS), roster=[dict(name="Y", chassis="Brute",
        weapons=["Autocannon"], hp=80)], won=True)
    s4 = GameState.from_dict(v1_win)
    assert s4.act == 2 and not s4.won and s4.act2["force"].get("Brute") == 1, \
        "v1 winner should migrate into Act II"
    v1_mid = dict(credits=2000, salvage=3, techs=[], beaten=["Rustwater Irregulars"],
                  roster=[dict(name="Z", chassis="Jackal", weapons=["SMG Pod"], hp=60)],
                  won=False)
    s5 = GameState.from_dict(v1_mid)
    assert s5.act == 1 and s5.act2 is None and len(s5.roster) == 1
    print("  act2 save round-trip & v1 migration OK")

    print("self-test passed.")

def _battle_over_check():
    b = _G["battle"]
    s = _G["state"]
    squad, enemies = b["squad"], b["enemies"]

            and b["round"] < 99:
        return None

    result = dict(kind="over", won=won)
    if won:
        credits, salvage = contract_rewards(s, b["outfit"], b["first_time"])
        s.credits += credits
        s.salvage += salvage
        s.beaten.add(b["outfit"]["name"])
        recovered = [m.name for m in squad if not m.alive]
        for m in squad:
            if not m.alive:
                m.hp = 1
        result.update(credits=credits, salvage=salvage, recovered=recovered,
                      final=b["outfit"]["name"] == "Force Majeure")
        if result["final"]:

        lost = [m for m in squad if not m.alive]
        payout = sum(m.value() for m in lost) // 3
        s.credits += payout

        result.update(lost=[m.name for m in lost], insurance=payout)

            v = _a2_view()
            if err:
                v["error"] = err
            return json.dumps(v)
        if cmd == "a2_consolidate":
            lines = a2_end_turn(s)
            v = _a2_view()
            v["ledger_now"] = lines
            return json.dumps(v)
        if cmd == "a2_commit":
            b = a2_start_battle(s, p["theater"], {k: int(v) for k, v in p["commit"].items()})
            if isinstance(b, str):
                return json.dumps(dict(kind="error", msg=b))
            _A2["battle"] = b
            return json.dumps(_a2_battle_view({"kind": "a2_started"}))
        if cmd == "a2_doctrine":
            b = _A2["battle"]
            if b is None:
                return json.dumps(dict(kind="error", msg="No offensive in progress."))
            res = a2_round(s, b, p["doctrine"])
            if res != "ongoing":
                return json.dumps(_a2_end_and_report(res))
            return json.dumps(_a2_battle_view({"kind": "a2_round"}))
        if cmd == "a2_breakoff":
            b = _A2["battle"]
            if b is None:
                return json.dumps(dict(kind="error", msg="No offensive in progress."))
            a2_breakoff(b)
            return json.dumps(_a2_end_and_report("breakoff"))
        if cmd == "start_battle":
            return json.dumps(_start_battle(p["outfit"], p["uids"]))
        if cmd == "battle_next":
            return json.dumps(_battle_next())
        if cmd == "battle_player":
            return json.dumps(_battle_player(p))
        if cmd == "battle_withdraw":
            return json.dumps(_battle_withdraw())
        return json.dumps(dict(kind="error", msg=f"unknown command {cmd}"))
    except Exception as e:  # surface errors to JS console rather than dying
        return json.dumps(dict(kind="error", msg=f"{type(e).__name__}: {e}"))

</script>

<script>
/* ============================================================== bootstrap */
// To play fully offline / self-hosted: download a Pyodide release
// (https://github.com/pyodide/pyodide/releases -> pyodide-0.26.4.tar.bz2),
// unpack it next to this file as ./pyodide/, and change PYODIDE_BASE to "./pyodide/".
const PYODIDE_BASE = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";

/* ------------------------------------------------------------- themes */
// Add your own palette here: seven colors + a glow, one line each.
const THEMES = {
  ice:      { bg:"#000", fg:"#fff", dim:"#48708a", hot:"#ff6a7a",
              gold:"#ffd24d", tech:"#c9a0ff", sel:"#0f2a3a", glow:"rgba(154,220,255,.35)" },
  phosphor: { bg:"#060a06", fg:"#9dff9d", dim:"#4e7a4e", hot:"#ff5a5a",
              gold:"#ffd24d", tech:"#d78cff", sel:"#123a12", glow:"rgba(157,255,157,.35)" },
};
const DEFAULT_THEME = "ice";   // change this to make your theme the default
function applyTheme(name) {
  const t = THEMES[name] || THEMES[DEFAULT_THEME];
  const r = document.documentElement.style;
  for (const [k, v] of Object.entries(t)) r.setProperty("--" + k, v);
}
function initThemer() {
  const sel = document.getElementById("theme-select");
  sel.innerHTML = Object.keys(THEMES).map(n => `<option value="${n}">${n}</option>`).join("");
  sel.value = DEFAULT_THEME;
  sel.onchange = () => { applyTheme(sel.value); sel.blur(); };   // blur so game keys resume
  applyTheme(DEFAULT_THEME);
}

let api = null;
async function boot() {
  if (window.__SOLVENT_TEST_PYAPI__) {   // test harness injects a ready runtime
    const pyapi = window.__SOLVENT_TEST_PYAPI__;
    api = (cmd, payload = {}) => JSON.parse(pyapi(cmd, JSON.stringify(payload)));
    META = api("meta");
    showTitle();
    return;
  }
  const s = document.createElement("script");
  s.src = PYODIDE_BASE + "pyodide.js";
  s.onload = async () => {
    const py = await loadPyodide({ indexURL: PYODIDE_BASE });
    py.runPython(document.getElementById("py-logic").textContent);
    py.runPython(document.getElementById("py-api").textContent);
    const pyapi = py.globals.get("api");
    api = (cmd, payload = {}) => JSON.parse(pyapi(cmd, JSON.stringify(payload)));
    META = api("meta");
    showTitle();
  };
  s.onerror = () => {
    document.getElementById("boot").textContent =
      "Could not load the Python runtime. If you are offline, vendor Pyodide " +
      "locally (see the comment at the top of this file's script).";
  };
  document.head.appendChild(s);
}

/* ============================================================== rendering */
const $screen = document.getElementById("screen");
const $menu = document.getElementById("menu");
const $detail = document.getElementById("detail");
let META = null;
let VIEW = null;            // last state view
let menuState = null;       // {items, sel, onSelect, onBack}

const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const pad = (t, n) => String(t).padEnd(n);
const bar = (hp, max, w = 20) => {
  const f = max ? Math.round(w * hp / max) : 0;
  return "[" + "#".repeat(f) + ".".repeat(w - f) + "]";
};
function screenHTML(title, lines) {
  const money = VIEW ? `Credits ${VIEW.credits.toLocaleString()}   Salvage ${VIEW.salvage}` : "";
  let h = `<span class="hdr">S O L V E N T</span> <span class="dim">| ${esc(title)}</span>` +
          `<span class="money">${esc(money)}</span>\n` +
          `<span class="bar">${"-".repeat(86)}</span>\n`;
  h += lines.join("\n");
  return h;
}
function draw(title, lines, items, onSelect, onBack, detailFor) {
  $screen.innerHTML = screenHTML(title, lines);
  menuState = items ? { items, sel: 0, onSelect, onBack, detailFor } : { onBack };
  renderMenu();
}
function renderMenu() {
  if (!menuState || !menuState.items) { $menu.innerHTML = ""; $detail.textContent = ""; return; }
  $menu.innerHTML = menuState.items.map((it, i) => {
    const cls = "mi" + (i === menuState.sel ? " sel" : "") + (it.enabled === false ? " off" : "");
    const cur = i === menuState.sel ? "&gt;" : "&nbsp;";
    return `<div class="${cls}" data-i="${i}"><span class="cur">${cur}</span>${it.html || esc(it.label)}</div>`;
  }).join("");
  const it = menuState.items[menuState.sel];
  $detail.textContent = (it && it.detail) || "";
  [...$menu.children].forEach(el => {
    el.onclick = () => {
      const i = +el.dataset.i;
      if (menuState.items[i].enabled === false) return;
      menuState.sel = i; renderMenu(); activate();
    };
  });
}
function move(d) {
  if (!menuState || !menuState.items) return;
  const n = menuState.items.length;
  menuState.sel = (menuState.sel + d + n) % n;
  renderMenu();
}
function activate() {
  if (!menuState || !menuState.items) return;
  const it = menuState.items[menuState.sel];
  if (!it || it.enabled === false) return;
  menuState.onSelect(menuState.sel, it);
}
document.addEventListener("keydown", e => {
  if (e.target && e.target.id === "theme-select") return;
  if (["ArrowUp","ArrowDown","Enter","Escape","Backspace"].includes(e.key)) e.preventDefault();
  if (AUTO && (e.key === "q" || e.key === "Escape" || e.key === "Backspace")) { AUTO = null; return; }
  if (e.key === "ArrowUp" || e.key === "k") move(-1);
  else if (e.key === "ArrowDown" || e.key === "j") move(1);
  else if (e.key === "Enter") activate();
  else if (e.key === "q" || e.key === "Escape" || e.key === "Backspace") menuState && menuState.onBack && menuState.onBack();
});

/* ============================================================== screens */
function refresh() { VIEW = api("view"); }

function showTitle() {
  const art = [
"  ____   ___  _ __     _______ _   _ _____ ",
" / ___| / _ \\| |\\ \\   / / ____| \\ | |_   _|",
" \\___ \\| | | | | \\ \\ / /|  _| |  \\| | | |  ",
"  ___) | |_| | |__\\ V / | |___| |\\  | | |  ",
" |____/ \\___/|_____\\_/  |_____|_| \\_| |_|  ",
"", "        a Chrome Dogs operation", "            by Float64", ""].map(esc);
  VIEW = null;
  draw("", art, [
    { label: "New campaign" },
    { label: "Import save file" },
  ], (i) => {
    if (i === 0) { VIEW = api("new_game"); showIntro(); }
    else importSave();
  }, null);
}

function showIntro() {
  draw("OFF THE BOOKS", META.intro.map(esc), [{ label: "[ take the contract ]" }],
       () => showHQ(), () => showHQ());
}

function notice(title, lines, then) {
  draw(title, lines.map(esc), [{ label: "[ continue ]" }], then, then);
}

function showHQ() {
  refresh();
  if (VIEW.act === 2) return showA2HQ();
  if (VIEW.won) return showVictory();
  if (VIEW.game_over) return showGameOver();
  const nxt = VIEW.contracts.find(c => !c.beaten && !c.locked);
  draw("HQ — CHROME DOGS", [], [
    { label: "Contract board", detail: nxt ? `Next target: ${nxt.name}` : "" },
    { label: "Hangar", detail: "Build, repair, and refit your frames." },
    { label: "R&D lab", detail: "Invest war prizes into technology." },
    { label: "Export save file", detail: "Download your campaign as a .json file." },
    { label: "Import save file", detail: "Load a previously exported campaign." },
  ], i => [showContracts, showHangar, showRnd, exportSave, importSave][i](), null);
}

/* ---------------- hangar ---------------- */
function mechLine(m) {
  const hl = Object.entries(m.heal_left || {}).map(([w, n]) => ` (${n} chg)`).join("");
  return `${pad(m.name, 15)} ${pad(m.chassis, 11)} ${bar(m.hp, m.max_hp)} ` +
         `${String(m.hp).padStart(3)}/${String(m.max_hp).padEnd(3)} ${m.weapons.join("/") || "(unarmed)"}${hl}`;
}
function showHangar() {
  refresh();
  const items = VIEW.roster.map(m => ({
    label: mechLine(m),
    detail: `Repair ${m.repair_cost}cr  Armor ${m.armor}  Speed ${m.speed}  Evade ${m.evade}`,
    uid: m.uid,
  }));
  const total = VIEW.roster.reduce((a, m) => a + m.repair_cost, 0);
  items.push({ label: "Commission new frame", detail: "Quadcopters to orbital lasers, budget permitting." });
  items.push({ label: `Repair all (${total}cr)`, enabled: total > 0 && VIEW.credits >= total });
  draw("HANGAR", [`<span class="dim">Roster: ${VIEW.roster.length} frames (max 4 deploy per contract)</span>`],
    items, (i, it) => {
      if (it.uid) showMech(it.uid);
      else if (i === VIEW.roster.length) showBuy();
      else { api("repair_all"); showHangar(); }
    }, showHQ);
}
function showMech(uid) {
  refresh();
  const m = VIEW.roster.find(x => x.uid === uid);
  if (!m) return showHangar();
  const hard = VIEW.shop_chassis.concat().find(c => c.name === m.chassis);
  const hp = m.weapons.length;
  const hpts = (hard ? hard.hardpoints : hp);
  draw(`HANGAR / ${m.name.toUpperCase()}`, [
    esc(`${m.name} — ${m.chassis}.`),
    esc(`HP ${m.hp}/${m.max_hp}   Armor ${m.armor}   Speed ${m.speed}   Evade ${m.evade}`),
    esc(`Loadout: ${m.weapons.join(", ") || "none"}`),
  ], [
    { label: `Repair (${m.repair_cost}cr)`, enabled: m.repair_cost > 0 && VIEW.credits >= m.repair_cost },
    { label: `Fit weapon (${hp}/${hpts} hardpoints)`, enabled: hp < hpts },
    { label: "Strip a weapon (50% refund)", enabled: m.weapons.length > 1 },
    { label: `Scrap frame (+${Math.floor(m.value / 3)}cr)`, enabled: VIEW.roster.length > 1 },
  ], i => {
    if (i === 0) { api("repair", { uid }); showMech(uid); }
    else if (i === 1) showFit(uid);
    else if (i === 2) showStrip(uid);
    else {
      draw(`HANGAR / ${m.name.toUpperCase()}`,
           [esc(`Scrap ${m.name} for ${Math.floor(m.value / 3)}cr? This is permanent.`)],
           [{ label: "Keep it" }, { label: "Scrap it" }],
           (j) => { if (j === 1) { api("scrap", { uid }); showHangar(); } else showMech(uid); },
           () => showMech(uid));
    }
  }, showHangar);
}
function showFit(uid) {
  refresh();
  const items = VIEW.shop_weapons.map(w => ({
    label: `${pad(w.name, 16)} ${w.heal ? `${w.lo}-${w.hi} repair, ${w.charges} chg` :
            `${w.lo}-${w.hi} dmg  ${w.acc}% acc`}  ${w.cost}cr`,
    enabled: w.afford, detail: w.desc, w: w.name,
  }));
  draw("FIT WEAPON", [], items, (i, it) => { api("fit", { uid, weapon: it.w }); showMech(uid); }, () => showMech(uid));
}
function showStrip(uid) {
  refresh();
  const m = VIEW.roster.find(x => x.uid === uid);
  draw("STRIP WEAPON", [], m.weapons.map((w, idx) => ({ label: w, idx })),
    (i, it) => { api("strip", { uid, index: it.idx }); showMech(uid); }, () => showMech(uid));
}
function showBuy() {
  refresh();
  const items = VIEW.shop_chassis.map(c => ({
    label: `${pad(c.name, 11)} ${String(c.hp).padStart(3)}hp ${c.armor}arm ` +
           `${String(c.speed).padStart(2)}spd ${String(c.evade).padStart(2)}evd ${c.hardpoints}pt  ${c.cost}cr`,
    enabled: c.afford, detail: c.desc, c: c.name,
  }));
  draw("COMMISSION FRAME", [], items, (i, it) => { api("buy", { chassis: it.c }); showHangar(); }, showHangar);
}

/* ---------------- R&D ---------------- */
function showRnd() {
  refresh();
  const done = VIEW.researched.join(", ") || "none";
  if (!VIEW.techs.length)
    return notice("R&D LAB", ["The tree is complete. The lab techs are playing cards."], showHQ);
  draw("R&D LAB", [
    `<span class="dim">Sink contract money and battlefield salvage into the tech tree.</span>`,
    `<span class="tech">Researched: ${esc(done)}</span>`,
  ], VIEW.techs.map(t => ({
    label: `${pad(t.name, 24)} ${String(t.credits).padStart(5)}cr + ${String(t.salvage).padStart(2)} salvage`,
    enabled: t.afford, detail: t.desc, key: t.key,
  })), (i, it) => { api("research", { key: it.key }); showRnd(); }, showHQ);
}

/* ---------------- contracts & deploy ---------------- */
function showContracts() {
  refresh();
  draw("CONTRACT BOARD", [
    `<span class="dim">Beaten contracts can be re-run for reduced pay (grind money, risk frames).</span>`,
  ], VIEW.contracts.map((c, idx) => ({
    label: `${c.beaten ? "[CLEARED]" : c.locked ? "[LOCKED] " : "[OPEN]   "} T${c.tier}  ` +
           `${pad(c.name, 24)} ${String(c.credits).padStart(5)}cr  ${String(c.salvage).padStart(2)} salvage`,
    enabled: !c.locked, detail: c.blurb, idx,
  })), (i, it) => showDeploy(it.idx), showHQ);
}
function showDeploy(outfitIdx, chosen) {
  refresh();
  chosen = chosen || new Set();
  const ready = VIEW.roster.filter(m => m.alive && m.weapons.length);
  if (!ready.length) return notice("DEPLOY", ["No combat-ready frames. Fit weapons in the hangar."], showHQ);
  const items = ready.map(m => ({
    label: `[${chosen.has(m.uid) ? "x" : " "}] ${mechLine(m)}`, uid: m.uid,
  }));
  items.push({ label: `-- Deploy (${chosen.size}/4) --`, enabled: chosen.size > 0 && chosen.size <= 4 });
  const keep = menuState && menuState.deployCursor != null ? menuState.deployCursor : 0;
  draw("DEPLOY SQUAD", [
    `<span class="dim">Toggle frames to deploy. Damaged frames deploy at current HP.</span>`,
  ], items, (i, it) => {
    if (it.uid) {
      chosen.has(it.uid) ? chosen.delete(it.uid) : chosen.size < 4 && chosen.add(it.uid);
      showDeploy(outfitIdx, chosen);
      menuState.sel = i; renderMenu();
    } else {
      const r = api("start_battle", { outfit: outfitIdx, uids: [...chosen] });
      if (r.kind === "started") battleLoop(r);
    }
  }, showContracts);
}

/* ---------------- battle ---------------- */
let BATTLE = null;
let AUTO = null;   // {downed: n} while autofight engaged
function battleLines(b) {
  const lines = [];
  lines.push(`<span class="hot">HOSTILES — ${esc(b.outfit)}</span>`);
  for (const e of b.enemies)
    lines.push(e.alive
      ? `<span class="hot"> ${esc(pad(e.name, 13) + pad(e.chassis, 11) + bar(e.hp, e.max_hp) + " " + String(e.hp).padStart(3) + "/" + pad(e.max_hp, 3) + " " + e.weapons.join("/"))}</span>`
      : `<span class="dim"> ${esc(pad(e.name, 13) + pad(e.chassis, 11))}[ DESTROYED ]</span>`);
  lines.push("");
  lines.push(`<span class="hdr">CHROME DOGS</span>`);
  for (const m of b.squad)
    lines.push(m.alive
      ? ` ${esc(mechLine(m))}${m.braced ? ' <span class="dim">(braced)</span>' : ""}`
      : `<span class="dim"> ${esc(pad(m.name, 13) + pad(m.chassis, 11))}[ DOWN ]</span>`);
  lines.push("");
  const log = b.log || [];
  lines.push(`<span class="log">${log.map((l, i) =>
    i >= log.length - 2 ? `<span class="new">${esc(l)}</span>` : esc(l)).join("\n")}</span>`);
  return lines;
}
function battleLoop(b) {
  BATTLE = b;
  refresh();
  if (b.kind === "over") return battleOver(b);
  if (b.kind === "withdrew") return withdrawDone(b);
  if (b.kind === "need_player") {
    if (AUTO) {
      const downedNow = b.squad.filter(m => !m.alive).length;
      if (downedNow > AUTO.downed) { AUTO = null; return battleActionMenu(b); }
      draw(`CONTRACT / ${b.outfit.toUpperCase()}`,
           battleLines(b).concat(["", `<span class="gold">AUTOFIGHT — ${esc(b.unit_name)} acting... (q to cancel)</span>`]),
           null, null, null);
      setTimeout(() => autoAct(b), 400);
      return;
    }
    return battleActionMenu(b);
  }
  // enemy acted / round marker / started: brief pace, then continue
  draw(`CONTRACT / ${b.outfit.toUpperCase()}`, battleLines(b), null, null, null);
  setTimeout(() => battleLoop(api("battle_next")), b.kind === "enemy_acted" ? 350 : 120);
}
function autoAct(b) {
  if (!AUTO) return battleActionMenu(b);          // cancelled during the pause
  const fire = b.actions.find(a => a.type === "fire" && a.enabled !== false);
  if (fire) {
    const tgt = b.enemies.find(e => e.alive);
    return battleLoop(api("battle_player", { type: "fire", weapon: fire.weapon, target: tgt.uid }));
  }
  const heal = b.actions.find(a => a.type === "heal" && a.enabled);
  const downed = b.squad.filter(m => !m.alive);
  const hurt = b.squad.filter(m => m.alive && m.hp < m.max_hp)
                      .sort((a, c) => a.hp / a.max_hp - c.hp / c.max_hp);
  if (heal && (downed.length || hurt.length))
    return battleLoop(api("battle_player", { type: "heal", weapon: heal.weapon,
                                             target: (downed[0] || hurt[0]).uid }));
  return battleLoop(api("battle_player", { type: "brace" }));
}
function battleActionMenu(b) {
  const items = b.actions.map(a => {
    if (a.type === "fire") return { label: `Fire ${a.weapon}  (${a.lo}-${a.hi} dmg, ${a.acc}% acc)`, a };
    if (a.type === "heal") return { label: `Deploy ${a.weapon}  (${a.lo}-${a.hi} repair, revives downed, ${a.left} left)`, enabled: a.enabled, a };
    return { label: "Brace  (+3 armor, harder to hit until next turn)", a };
  });
  items.push({ label: "Autofight  (first gun, first target, until a frame goes down)", auto: true });
  draw(`CONTRACT / ${b.outfit.toUpperCase()}`,
       battleLines(b).concat(["", `<span class="gold">${esc(b.unit_name)}'s move:</span>`]),
       items, (i, it) => {
    if (it.auto) { AUTO = { downed: b.squad.filter(m => !m.alive).length }; return autoAct(b); }
    const a = it.a;
    if (a.type === "brace") return battleLoop(api("battle_player", { type: "brace" }));
    if (a.type === "fire") {
      const tg = b.enemies.filter(e => e.alive);
      draw(`CONTRACT / ${b.outfit.toUpperCase()}`,
           battleLines(b).concat(["", `<span class="gold">Target for ${esc(a.weapon)}:</span>`]),
           tg.map(e => ({ label: `${pad(e.name, 13)} ${pad(e.chassis, 11)} ${e.hp}/${e.max_hp}hp  armor ${e.armor}`, uid: e.uid })),
           (j, t) => battleLoop(api("battle_player", { type: "fire", weapon: a.weapon, target: t.uid })),
           () => battleActionMenu(b));
    } else {
      draw(`CONTRACT / ${b.outfit.toUpperCase()}`,
           battleLines(b).concat(["", `<span class="gold">Repair target for ${esc(a.weapon)}:</span>`]),
           b.squad.map(m => ({
             label: `${m.alive ? "" : "[DOWN] "}${pad(m.name, 13)} ${pad(m.chassis, 11)} ${m.hp}/${m.max_hp}hp` +
                    (m.uid === b.unit_uid ? " (self)" : ""), uid: m.uid })),
           (j, t) => battleLoop(api("battle_player", { type: "heal", weapon: a.weapon, target: t.uid })),
           () => battleActionMenu(b));
    }
  }, () => { // q during your move -> withdrawal prompt
    draw(`CONTRACT / ${b.outfit.toUpperCase()}`,
         battleLines(b).concat(["", `<span class="hot">Withdraw from the contract? Downed frames are lost.</span>`]),
         [{ label: "Fight on" }, { label: "Withdraw" }],
         (i) => i === 0 ? battleActionMenu(b) : battleLoop(api("battle_withdraw")),
         () => battleActionMenu(b));
  });
}
function battleOver(r) {
  AUTO = null;
  refresh();
  if (r.won) {
    const lines = [`Contract fulfilled. Payment: ${r.credits.toLocaleString()}cr. Salvage: ${r.salvage} tons.`];
    if (r.recovered && r.recovered.length)
      lines.push(`Downed frames dragged home at 1 HP: ${r.recovered.join(", ")}.`);
    notice("CONTRACT COMPLETE", lines, () => r.final ? showA2Transition() : showHQ());
  } else {
    const lines = ["The Dogs are wiped off the field. No pay. No salvage."];
    if (r.lost && r.lost.length) {
      lines.push(`Frames lost to enemy salvage crews: ${r.lost.join(", ")}.`);
      lines.push(`The underwriters pay out a third: ${r.insurance.toLocaleString()}cr against the write-off.`);
    }
    notice("CONTRACT FAILED", lines, showHQ);
  }
}
function withdrawDone(r) {
  AUTO = null;
  const lines = ["The Dogs pull back. No pay, no salvage."];
  if (r.lost && r.lost.length)
    lines.push(`Downed frames are left to the scavengers. Insurance pays ${r.insurance.toLocaleString()}cr.`);
  notice("WITHDRAWAL", lines, showHQ);
}

/* ---------------- endings ---------------- */
function showVictory() {
  refresh();
  notice("MARKET DOMINANCE", [
    "Force Majeure's stock ticker flatlines on every exchange that still exists.",
    "",
    "The Chrome Dogs are now the only solvent outfit on the continent —",
    "which makes you, technically, the war economy.",
    "",
    "The contracts will keep coming. They always do.",
    "",
    `Final ledger: ${VIEW.credits.toLocaleString()} credits, ${VIEW.salvage} tons of salvage.`,
  ], showTitle);
}
function showGameOver() {
  notice("INSOLVENT", [
    "No frames. No credits. No collateral.",
    "",
    "The Chrome Dogs are dissolved by their creditors and sold for parts.",
    "Somewhere, an accountant at Force Majeure closes your file.",
  ], showTitle);
}


/* ---------------- ACT II: THE PRODUCTION WAR ---------------- */
function showA2Transition() {
  refresh();
  notice("MARKET DOMINANCE", META.a2_intro, () => { api("a2_seen_interlude"); showA2HQ(); });
}
const cr = n => n.toLocaleString() + "cr";

function showA2HQ() {
  refresh();
  const v = api("a2_view");
  if (v.won) return showA2Finale();
  const held = v.theaters.filter(t => t.held).map(t => t.name).join(", ") || "none";
  const lines = [
    `Turn ${v.turn}   Revenue ${cr(v.income)}/turn   Upkeep ${cr(v.upkeep)}/turn`,
    `Force value ${cr(v.force_value)}   Capacity ${cr(v.cap - v.cap_used)} / ${cr(v.cap)} this turn`,
    `Held: ${held}`, ""
  ].concat(v.ledger).map(esc);
  draw("HQ — THE PRODUCTION WAR", lines, [
    { label: "War room", detail: "Pick a theater and commit formations." },
    { label: "Production", detail: "Feed the lines." },
    { label: `Expand factories (${cr(v.expand_cost)}, +1,000 capacity)`,
      enabled: v.expands < v.expand_max && v.credits >= v.expand_cost,
      detail: `${v.expand_max - v.expands} expansions remaining.` },
    { label: "R&D lab", detail: "The tree still grows." },
    { label: "Consolidate (end turn)", detail: "Collect revenue, pay upkeep, reset capacity." },
    { label: "Export save file" },
    { label: "Import save file" },
  ], (i) => {
    if (i === 0) showA2WarRoom();
    else if (i === 1) showA2Production();
    else if (i === 2) { const r = api("a2_expand"); r.error ? notice("PRODUCTION", [r.error], showA2HQ) : showA2HQ(); }
    else if (i === 3) showRnd();
    else if (i === 4) notice("CONSOLIDATION", api("a2_consolidate").ledger_now, showA2HQ);
    else if (i === 5) exportSave();
    else importSave();
  }, null);
}

function showA2Production() {
  const v = api("a2_view");
  refresh();
  const lines = [`Capacity ${cr(v.cap - v.cap_used)} of ${cr(v.cap)} left this turn. Enter builds one unit.`, ""]
    .concat(v.force.map(f =>
      `${String(f.count).padStart(3)}x ${pad(f.unit, 17)} ${pad(f.role, 8)} ap ${String(f.ap).padStart(3)}  hp ${String(f.ehp).padStart(3)}`))
    .map(esc);
  draw("PRODUCTION", lines, v.catalogue.map(c => ({
    label: `${pad(c.unit, 17)} ${pad(c.role, 8)} ap ${String(c.ap).padStart(3)}  hp ${String(c.ehp).padStart(3)}  ${String(c.cost).padStart(5)}cr   (own ${c.owned})`,
    enabled: c.afford, unit: c.unit,
  })), (i, it) => {
    const keep = menuState.sel;
    const r = api("a2_build", { unit: it.unit, count: 1 });
    if (r.error) return notice("PRODUCTION", [r.error], showA2Production);
    showA2Production();
    menuState.sel = keep; renderMenu();
  }, showA2HQ);
}

function showA2WarRoom() {
  const v = api("a2_view");
  refresh();
  draw("WAR ROOM", ["Intelligence estimates. Bring more than they have.", ""].map(esc),
    v.theaters.map(t => ({
      label: `${t.held ? "[HELD]  " : (t.locked ? "[LOCKED]" : "[OPEN]  ")} ${pad(t.name, 20)} garrison ~${cr(t.garrison)}   +${cr(t.revenue)}/turn`,
      enabled: !t.held && !t.locked, detail: t.blurb, idx: t.idx,
    })), (i, it) => showA2Commit(it.idx, {}, 0), showA2HQ);
}

function showA2Commit(tidx, commit, cur) {
  const v = api("a2_view");
  refresh();
  const units = v.force;
  const cval = units.reduce((a, u) => a + (commit[u.unit] || 0) * u.cost, 0);
  const anyCombat = units.some(u => (commit[u.unit] || 0) > 0 && u.role !== "support");
  const items = units.map(u => ({
    label: `${String(commit[u.unit] || 0).padStart(3)}/${String(u.count).padEnd(3)} ${pad(u.unit, 17)} ${pad(u.role, 8)} (${u.cost}cr)`,
    u,
  }));
  items.push({ label: "[ Commit everything ]", all: true });
  items.push({ label: `[ Launch offensive (${cr(cval)} committed) ]`, enabled: anyCombat, launch: true });
  draw(`COMMIT — ${api("a2_view").theaters[tidx].name.toUpperCase()}`,
    ["Committed formations fight; reserves stay safe.",
     "A defeat writes off everything committed.", ""].map(esc),
    items, (i, it) => {
    if (it.launch) {
      const r = api("a2_commit", { theater: tidx, commit });
      if (r.kind === "error") return notice("COMMIT", [r.msg], () => showA2Commit(tidx, commit, i));
      return a2Battle(r);
    }
    if (it.all) units.forEach(u => commit[u.unit] = u.count);
    else commit[it.u.unit] = ((commit[it.u.unit] || 0) + 1) % (it.u.count + 1);
    showA2Commit(tidx, commit, i);
  }, showA2WarRoom);
  menuState.sel = cur || 0; renderMenu();
}

function a2StackLines(b) {
  const row = (s, cls) => s.count > 0
    ? `<span class="${cls}">  ${String(s.count).padStart(3)}x ${pad(esc(s.unit), 17)} ${bar(s.pool, s.cap, 16)}</span>`
    : `<span class="dim">   -- ${pad(esc(s.unit), 17)} [ WIPED ]</span>`;
  return [`<span class="hot">COUNTERPARTY GARRISON</span>`]
    .concat(b.e.map(s => row(s, "hot")))
    .concat(["", `<span class="ok">CHROME DOGS</span>`])
    .concat(b.p.map(s => row(s, "ok")))
    .concat([""]).concat(b.log.map(l => `<span class="dim">${esc(l)}</span>`));
}

function a2Battle(b) {
  if (b.kind === "a2_over") { AUTO = null; return a2Over(b); }
  refresh();
  if (AUTO) {
    const pool = b.p.reduce((a, s) => a + s.pool, 0);
    const cap = b.p.reduce((a, s) => a + s.cap, 0) || 1;
    if (pool / cap < 0.4) AUTO = null;
    if (AUTO) {
      draw(`OFFENSIVE / ${b.theater.toUpperCase()}  r${b.round}`,
           a2StackLines(b).concat(["", `<span class="gold">AUTO-DOCTRINE — q to take command</span>`]),
           null, null, null);
      setTimeout(() => {
        if (!AUTO) return a2Battle(Object.assign({}, b, { kind: "a2_round" }));
        const val = (ss, role) => ss.filter(s => s.role === role)
          .reduce((a, s) => a + s.count * s.cost_each, 0);
        const tot = b.e.reduce((a, s) => a + s.count * s.cost_each, 0) || 1;
        let d = "BALANCED";
        if (b.eng > 0 && pool / cap < 0.6) d = "ENGINEERS";
        else if (val(b.e, "armor") / tot > 0.35) d = "FOCUS ARMOR";
        else if (val(b.e, "swarm") / tot > 0.5) d = "SWEEP SWARMS";
        a2Battle(api("a2_doctrine", { doctrine: d }));
      }, 550);
      return;
    }
  }
  const items = b.doctrines.map(d => ({
    label: d + (d === "ENGINEERS" ? `  (${b.eng} charges)` : ""),
    enabled: d !== "ENGINEERS" || b.eng > 0, d,
  }));
  items.push({ label: "Auto-doctrine  (until losses mount, q to cancel)", auto: true });
  items.push({ label: "Break off  (rearguard pays 10%)", breakoff: true });
  draw(`OFFENSIVE / ${b.theater.toUpperCase()}  r${b.round}`,
       a2StackLines(b).concat(["", `<span class="gold">Doctrine for round ${b.round + 1}:</span>`]),
       items, (i, it) => {
    if (it.auto) { AUTO = { a2: true }; return a2Battle(b); }
    if (it.breakoff) return a2Battle(api("a2_breakoff"));
    a2Battle(api("a2_doctrine", { doctrine: it.d }));
  }, null);
}

function a2Over(r) {
  refresh();
  const title = r.outcome === "won" ? "THEATER TAKEN"
    : (r.outcome === "lost" ? "OFFENSIVE ANNIHILATED" : "WITHDRAWAL");
  notice(title, r.lines, () => {
    if (r.won) return showA2Finale();
    notice("CONSOLIDATION", r.ledger, showA2HQ);
  });
}

function showA2Finale() {
  refresh();
  notice("FINAL SETTLEMENT",
    META.finale.concat(["", `Final ledger: ${VIEW.credits.toLocaleString()} credits, ${VIEW.salvage} tons of salvage.`]),
    showTitle);
}

/* ---------------- save files ---------------- */
function exportSave() {
  const data = api("export_save").save;
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "solvent_save.json";
  a.click();
  URL.revokeObjectURL(a.href);
  showHQ();
}
function importSave() {
  const input = document.createElement("input");
  input.type = "file"; input.accept = ".json,application/json";
  input.onchange = () => {
    const f = input.files[0];
    if (!f) return showTitle();
    f.text().then(t => {
      try {
        VIEW = api("import_save", { save: JSON.parse(t) });
        notice("SAVE LOADED", ["The ledger is restored. Back to work."],
               VIEW.act === 2 ? showA2HQ : showHQ);
      } catch (e) {
        notice("SAVE ERROR", ["That file did not parse as a Solvent campaign."], showTitle);
      }
    });
  };
  input.click();
}

initThemer();
boot();
</script>
